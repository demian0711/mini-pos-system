services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: minipos
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pos_user -d minipos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
